name: fatima_habib
description: موقع حجز دروس الآنسة فاطمة (Flutter Web + Supabase)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Architecture
  get_it: ^8.0.3
  dartz: ^0.10.1
  go_router: ^15.0.0

  # Backend
  supabase_flutter: ^2.9.0

  # UI
  google_fonts: ^6.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: false
